async function seedJdItems(){
  if(!confirm(`社内のジョブディスクリプション（2023年7月版・${JD_DEFAULT_ITEMS.length}項目）を取り込みますか？`)) return;
  const rows = JD_DEFAULT_ITEMS.map((t,ix)=>({block:t[0], item:t[1], skill_id:t[2]||null,
    flag:t[3]||'', note:t[4]||'', active:true, sort_order:(ix+1)*10}));
  const ins = await q(sb.from('jd_items').insert(rows).select());
  if(!ins) return;
  await loadAll(); render(); toast(`${rows.length}項目を取り込みました`);
}
/* 担当する仕事（職種）の入切。片方だけ・両方（兼任）どちらも選べる。 */
async function toggleJdTrack(track){
  const cur = (data.jdAssignments||[]).find(a=>a.empId===jdEmpId && a.dept===jdDept && a.track===track);
  if(cur){
    await q(sb.from('jd_assignments').delete().eq('id', cur.id));
    data.jdAssignments = data.jdAssignments.filter(a=>a.id!==cur.id);
  } else {
    const ins = await q(sb.from('jd_assignments').insert({employee_id:jdEmpId, dept:jdDept, track}).select());
    if(ins && ins[0]) data.jdAssignments.push({id:ins[0].id, empId:jdEmpId, dept:jdDept, track});
  }
  render();
}
/* 実績の数字。空欄にすると記録を消す。 */
async function setJdMetric(itemId, raw){
  const cur = (data.jdMetrics||[]).find(x=>x.empId===jdEmpId && x.period===selfingPeriod && x.itemId===itemId);
  const v = raw==='' || raw==null ? null : Number(raw);
  if(v!=null && !isFinite(v)) return;
  if(v==null){
    if(cur){ await q(sb.from('jd_metrics').delete().eq('id', cur.id));
             data.jdMetrics = data.jdMetrics.filter(x=>x.id!==cur.id); }
  } else if(cur){
    await q(sb.from('jd_metrics').update({value:v, updated_at:new Date().toISOString()}).eq('id', cur.id));
    cur.value = v;
  } else {
    const ins = await q(sb.from('jd_metrics').insert({employee_id:jdEmpId, period:selfingPeriod,
      item_id:itemId, value:v}).select());
    if(ins && ins[0]) data.jdMetrics.push({id:ins[0].id, empId:jdEmpId, period:selfingPeriod, itemId, value:v, note:''});
  }
  render();
}
async function setJdMark(itemId, mark){
  const cur = data.jdChecks.find(x=>x.empId===jdEmpId && x.period===selfingPeriod && x.itemId===itemId);
  if(cur && cur.mark===mark){                       // 同じ印をもう一度押したら取り消し
    await q(sb.from('jd_checks').delete().eq('id', cur.id));
    data.jdChecks = data.jdChecks.filter(x=>x.id!==cur.id);
  } else if(cur){
    await q(sb.from('jd_checks').update({mark, updated_at:new Date().toISOString()}).eq('id', cur.id));
    cur.mark = mark;
  } else {
    const ins = await q(sb.from('jd_checks').insert({employee_id:jdEmpId, period:selfingPeriod,
      item_id:itemId, mark}).select());
    if(ins && ins[0]) data.jdChecks.push({id:ins[0].id, empId:jdEmpId, period:selfingPeriod, itemId, mark});
  }
  render();
}
async function addJdItem(){
  const max = Math.max(0, ...data.jdItems.map(i=>i.sortOrder));
  /* いま開いている部署の、いちばん下の大分類に足す（すぐ見える場所に出るように） */
  const same = jdItemsAll().filter(i=>(i.dept||'（未分類）')===jdDept);
  const last = same[same.length-1];
  const ins = await q(sb.from('jd_items').insert({dept:jdDept==='（未分類）'?'':jdDept,
    block:last? last.block : 'D', subdesk:last? last.subdesk : '', track:'共通',
    item:'（新しい項目）', flag:'new', active:true, sort_order:max+10}).select());
  if(ins && ins[0]){ await loadAll(); render(); }
}
async function updJdItem(id, field, value){
  const patch = {}; patch[field] = (field==='skill_id' && !value)? null : value;
  await q(sb.from('jd_items').update(patch).eq('id', id));
  const i = data.jdItems.find(x=>x.id===id); if(!i) return;
  if(field==='skill_id') i.skillId = value; else if(field==='active') i.active = value; else i[field] = value;
  render();
}
async function delJdItem(id){
  const i = data.jdItems.find(x=>x.id===id);
  if(!confirm(`項目「${i?i.item:''}」を削除しますか？全員のチェック記録も消えます。\n（一時的に外すだけなら「使う」のチェックを外してください）`)) return;
  await q(sb.from('jd_items').delete().eq('id', id));
  data.jdItems  = data.jdItems.filter(x=>x.id!==id);
  data.jdChecks = data.jdChecks.filter(x=>x.itemId!==id);
  render(); toast('削除しました');
}

/* ================= 福利厚生（委員会） ================= */
/* スプレッドシート「【委員会】福利厚生・働き方」の内容をそのまま持ってきている。
   記名アンケートで、給与や上司への不満も含むため、この画面は管理者以上のみ。
   設問は q1..q59 のコードで持ち、welfare_questions に文面と種類がある。 */
let wfSub  = 'summary';   // summary | free | people | topics | tasks
let wfQ    = '';          // 自由記述で見ている設問
let wfWho  = '';          // 回答一覧で開いている人

const WF_SUBS = [['summary','集計'],['free','自由記述'],['people','回答一覧'],
                 ['topics','検討課題'],['tasks','タスク・アイデア']];

function wfQuestion(code){ return data.wfQuestions.find(q=>q.code===code); }
/* 回答を数値にする。数字ならそのまま、「満足」等は scale で読み替える。 */
function wfNum(resp, code){
  const q = wfQuestion(code); if(!q) return null;
  const v = (resp.answers||{})[code];
  if(v==null || v==='') return null;
  if(q.scale && q.scale[v]!=null) return q.scale[v];
  const n = Number(v);
  return isFinite(n) ? n : null;
}
function wfAvg(code){
  const xs = data.wfResponses.map(r=>wfNum(r, code)).filter(v=>v!=null);
  return xs.length ? {avg: xs.reduce((a,b)=>a+b,0)/xs.length, n: xs.length} : null;
}
/* 設問の短い見出し。[ ] があればその中身、無ければ先頭の番号を落として短くする。 */
function wfShort(label){
  const m = label.match(/\[([^\]]+)\]/);
  if(m) return m[1];
  return label.replace(/^\d+\.\s*/, '').replace(/[（(].*$/, '').slice(0, 26);
}
function wfBar(v, max, color){
  const pct = Math.max(0, Math.min(100, v / max * 100));
  return `<div class="progress" style="min-width:120px"><div style="width:${pct}%;background:${color}"></div></div>`;
}
function wfScoreColor(v){ return v >= 4 ? 'var(--ok)' : v >= 3 ? 'var(--accent)' : 'var(--warn)'; }

function viewWelfare(){
  if(myRank() < 2) return '<div class="panel"><h2>閲覧権限がありません</h2><p class="muted">福利厚生アンケートには記名の意見が含まれるため、管理者以上のみが閲覧できます。</p></div>';
  if(!data.wfResponses.length && !data.wfTopics.length)
    return '<div class="panel"><h2>🎁 福利厚生</h2><p class="muted">データがまだ登録されていません。</p></div>';
  if(!WF_SUBS.some(s=>s[0]===wfSub)) wfSub = 'summary';
  return `
  <div class="panel">
    <h2>🎁 福利厚生 <span class="en">委員会 — アンケート結果と検討課題</span></h2>
    <div class="toolbar">
      <div class="viewseg">
        ${WF_SUBS.map(([k,l])=>`<button class="${wfSub===k?'active':''}" onclick="wfSub='${k}';render()">${l}</button>`).join('')}
      </div>
      <div class="spacer"></div>
      <span class="badge b-purple">記名回答のため管理者以上のみ</span>
    </div>
    ${wfSub==='summary'? wfSummaryHtml()
     : wfSub==='free'?   wfFreeHtml()
     : wfSub==='people'? wfPeopleHtml()
     : wfSub==='topics'? wfTopicsHtml()
     :                   wfTasksHtml()}
  </div>`;
}

/* ---- 1) 集計 ---- */
function wfSummaryHtml(){
  const rs = data.wfResponses;
  const byOrg = {}, byEmp = {};
  rs.forEach(r=>{ byOrg[r.org||'（未記入）'] = (byOrg[r.org||'（未記入）']||0)+1;
                  byEmp[r.employment_type||'（未記入）'] = (byEmp[r.employment_type||'（未記入）']||0)+1; });

  const group = (title, codes, max, note) => {
    const rows = codes.map(c=>({c, q:wfQuestion(c), a:wfAvg(c)})).filter(x=>x.q && x.a);
    if(!rows.length) return '';
    rows.sort((a,b)=>a.a.avg-b.a.avg);          // 低い順＝手当てが要る順
    return `
    <div class="section-title" style="margin-top:16px">${title}
      ${note? `<span class="muted" style="font-weight:400">　${note}</span>`:''}</div>
    <div class="tablewrap"><table>
      <tr><th>項目</th><th style="width:150px">平均</th><th class="center" style="width:70px">点</th><th class="center" style="width:60px">回答</th></tr>
      ${rows.map(x=>`<tr>
        <td>${esc(wfShort(x.q.label))}</td>
        <td>${wfBar(x.a.avg, max, wfScoreColor(x.a.avg / max * 5))}</td>
        <td class="center"><b>${x.a.avg.toFixed(2)}</b><span class="muted small">/${max}</span></td>
        <td class="center muted">${x.a.n}</td>
      </tr>`).join('')}
    </table></div>`;
  };

  return `
  <div class="grid cols4" style="margin-bottom:6px">
    <div class="stat"><div class="num">${rs.length}</div><div class="lbl">回答数</div></div>
    ${Object.entries(byOrg).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>
      `<div class="stat"><div class="num">${v}</div><div class="lbl">${esc(k)}</div></div>`).join('')}
  </div>
  <p class="muted" style="margin-bottom:4px">雇用形態：${Object.entries(byEmp).sort((a,b)=>b[1]-a[1])
      .map(([k,v])=>`${esc(k)} ${v}名`).join('／')}</p>
  <p class="muted">期間：${rs.length? new Date(rs[0].submitted_at).toLocaleDateString('ja-JP')
      + ' 〜 ' + new Date(rs[rs.length-1].submitted_at).toLocaleDateString('ja-JP') : '—'}
    表は<b>点数の低い順</b>に並べています（手を打つべき順）。</p>

  ${group('全体の評価（5点満点）', ['q33','q34','q35','q36','q37','q38','q39'], 5)}
  ${group('働き方の満足度（5点満点）', ['q9','q10','q11','q12'], 5, '「満足」を5・「不満」を1として計算')}
  ${group('ワークライフバランス・組織（5点満点）', ['q13','q14','q15','q16','q24','q7'], 5)}
  ${group('福利厚生の重要度（5点満点・高いほど求められている）', ['q2','q3','q4','q5','q6'], 5, '「高い」を4・「普通」を3として計算')}

  <div class="section-title" style="margin-top:16px">仕事で重視すること（1位が最重視・数字が小さいほど優先）</div>
  <div class="tablewrap"><table>
    <tr><th>項目</th><th style="width:150px">平均順位</th><th class="center" style="width:80px">平均</th></tr>
    ${['q47','q48','q49','q50','q51','q52'].map(c=>({c,q:wfQuestion(c),a:wfAvg(c)}))
      .filter(x=>x.q&&x.a).sort((a,b)=>a.a.avg-b.a.avg).map(x=>`<tr>
        <td>${esc(wfShort(x.q.label))}</td>
        <td>${wfBar(7 - x.a.avg, 6, 'var(--accent)')}</td>
        <td class="center"><b>${x.a.avg.toFixed(2)}</b><span class="muted small">位</span></td>
      </tr>`).join('')}
  </table></div>`;
}

/* ---- 2) 自由記述 ---- */
function wfFreeHtml(){
  const texts = data.wfQuestions.filter(q=>q.kind==='text' &&
    data.wfResponses.some(r=>(r.answers||{})[q.code]));
  if(!texts.length) return '<div class="muted">自由記述の設問がありません。</div>';
  if(!wfQ || !texts.some(q=>q.code===wfQ)) wfQ = texts[0].code;
  const q = wfQuestion(wfQ);
  /* 「特になし」の類は後ろにまとめる。読む価値のある意見を上に出すため。 */
  const NOTHING = /^[\s]*(特に(は)?(ない|ありません|なし)|なし|無し|無いです|ございません|ありません|とくになし|特記事項なし|コメント無|無|[-－ー])[。\.\s]*$/;
  const all = data.wfResponses.map(r=>({r, v:(r.answers||{})[wfQ]||''})).filter(x=>x.v);
  const real = all.filter(x=>!NOTHING.test(x.v));
  const none = all.length - real.length;
  return `
  <div class="toolbar">
    <select onchange="wfQ=this.value;render()" style="max-width:100%;flex:1">
      ${texts.map(t=>`<option value="${t.code}" ${t.code===wfQ?'selected':''}>${esc(wfShort(t.label))}（${
        data.wfResponses.filter(r=>(r.answers||{})[t.code]).length}件）</option>`).join('')}
    </select>
  </div>
  <p class="muted" style="margin-bottom:10px">${esc(q?q.label:'')}</p>
  <p class="muted" style="margin-bottom:8px">中身のある回答 ${real.length}件${none? `／「特になし」等 ${none}件は省略`:''}</p>
  ${real.map(x=>`
    <div class="wf-quote">
      <div class="wf-who">${esc(x.r.name||'（無記名）')}<span class="muted">　${esc(x.r.org||'')}・${esc(x.r.employment_type||'')}</span></div>
      <div>${esc(x.v)}</div>
    </div>`).join('') || '<div class="muted">中身のある回答はありませんでした。</div>'}`;
}

/* ================= 社内の許可証管理 ================= */
/* 更新スケジュールは満了日から自動計算する（手入力の値があればそちらを優先）。
   ・ssw   ＝登録支援機関：満了日の「6か月前の月の初日」〜「4か月前の月末」
   ・shokai＝職業紹介事業：満了日の3か月前まで（開始の目安はその1か月前） */
const LICENSE_RULES = {
  ssw:    {label:'登録支援機関（出入国在留管理庁）', startMonths:6, endMonths:4, endOfMonth:true},
  shokai: {label:'職業紹介事業（厚生労働省）',       startMonths:4, endMonths:3, endOfMonth:false},
};
function addMonths(dateStr, minus){
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return null;
  const day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() - minus);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day, last));
  return d;
}
/* 日付を YYYY-MM-DD にする。toISOString() はUTCに変換してしまい、
   日本時間(UTC+9)では1日前にずれるため、必ずローカルの年月日から組み立てる。 */
const iso = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : '';
function licSchedule(l){
  const r = LICENSE_RULES[l.renewRule];
  let start = l.renewStart, end = l.renewEnd;
  if(r && l.validTo){
    if(!start){
      const s = addMonths(l.validTo, r.startMonths);
      if(s){ s.setDate(1); start = iso(s); }           // 「〜か月前の月の初日」
    }
    if(!end){
      const e = addMonths(l.validTo, r.endMonths);
      if(e){
        if(r.endOfMonth) e.setDate(new Date(e.getFullYear(), e.getMonth()+1, 0).getDate()); // 月末
        end = iso(e);
      }
    }
  }
  // 準備開始の目安：申請開始の1か月前
  let prep = l.prepStart;
  if(!prep && start){ const p = addMonths(start, 1); prep = iso(p); }
  return {start, end, prep};
}
function dbToLic(r){ return {id:r.id, name:r.name, authority:r.authority, licenseNo:r.license_no,
  status:r.status, validFrom:r.valid_from||'', validTo:r.valid_to||'', renewRule:r.renew_rule||'',
  renewStart:r.renew_start||'', renewEnd:r.renew_end||'', prepStart:r.prep_start||'',
  renewPeriod:r.renew_period||'', fee:r.fee||'', docs:r.docs||[], refUrl:r.ref_url||'',
  driveUrl:r.drive_url||'', notes:r.notes||'', sortOrder:r.sort_order||0}; }
function licToDb(l){ return {id:l.id, name:l.name, authority:l.authority||'', license_no:l.licenseNo||'',
  status:l.status||'有効', valid_from:dOrNull(l.validFrom), valid_to:dOrNull(l.validTo),
  renew_rule:l.renewRule||'', renew_start:dOrNull(l.renewStart), renew_end:dOrNull(l.renewEnd),
  prep_start:dOrNull(l.prepStart), renew_period:l.renewPeriod||'', fee:l.fee||'',
  docs:l.docs||[], ref_url:l.refUrl||'', drive_url:l.driveUrl||'', notes:l.notes||'',
  sort_order:l.sortOrder||0}; }

function licCardHtml(l){
  const s = licSchedule(l);
  const dTo = daysUntil(l.validTo), dEnd = daysUntil(s.end), dPrep = daysUntil(s.prep);
  // 状態の判定：期限切れ＞申請期限が近い＞申請できる＞準備期間＞余裕あり
  let badge = '<span class="badge b-gray">期限未入力</span>', level = '';
  if(l.validTo){
    if(dTo !== null && dTo < 0){ badge = '<span class="badge b-red">失効</span>'; level='red'; }
    else if(dEnd !== null && dEnd < 0){ badge = '<span class="badge b-red">更新申請期限を経過</span>'; level='red'; }
    else if(dEnd !== null && dEnd <= 30){ badge = `<span class="badge b-red">申請期限まで${dEnd}日</span>`; level='red'; }
    else if(dEnd !== null && dEnd <= 90){ badge = `<span class="badge b-yellow">申請期限まで${dEnd}日</span>`; level='yellow'; }
    else if(dPrep !== null && dPrep <= 0){ badge = '<span class="badge b-blue">更新の準備期間</span>'; level='blue'; }
    else { badge = `<span class="badge b-green">有効（あと${dTo}日）</span>`; }
  }
  const docs = l.docs||[];
  const done = docs.filter(d=>d.done).length;
  const pct = docs.length? Math.round(done*100/docs.length) : 0;
  const row = (k,v) => v? `<dt>${k}</dt><dd>${v}</dd>` : '';
  return `
  <div class="fieldset" style="margin-top:14px">
    <legend>${esc(l.name)}</legend>
    <div class="detail-head">
      <div class="tag-row">${badge}
        ${l.status && l.status!=='有効'? `<span class="badge b-yellow">${esc(l.status)}</span>`:''}
        ${l.licenseNo? `<span class="badge b-gray">番号 ${esc(l.licenseNo)}</span>`:''}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${l.refUrl? `<a class="btn small ghost" href="${esc(l.refUrl)}" target="_blank" rel="noopener">📖 公式サイト</a>`:''}
        ${l.driveUrl? `<a class="btn small secondary" href="${esc(l.driveUrl)}" target="_blank" rel="noopener">📁 許可証を開く</a>`
          : '<span class="muted" style="align-self:center">保管リンク未設定</span>'}

  await q(sb.from('licenses').update({docs:l.docs}).eq('id', id));
  render();
}

async function saveLic(isNew){
  const l = window._licDraft;
  const g = id => document.getElementById(id).value;
  l.name = g('lc_name').trim();
  if(!l.name){ toast('許可の名称を入力してください', true); return; }
  l.authority = g('lc_auth').trim(); l.licenseNo = g('lc_no').trim(); l.status = g('lc_status');
  l.validFrom = g('lc_from'); l.validTo = g('lc_to'); l.renewRule = g('lc_rule');
  l.renewPeriod = g('lc_period').trim(); l.fee = g('lc_fee').trim();
  l.prepStart = g('lc_prep'); l.renewStart = g('lc_rs'); l.renewEnd = g('lc_re');
  l.refUrl = g('lc_ref').trim(); l.driveUrl = g('lc_drive').trim(); l.notes = g('lc_notes');
  await q(sb.from('licenses').upsert(licToDb(l)));
  if(isNew) data.licenses.push(l);
  else { const i = data.licenses.findIndex(x=>x.id===l.id); if(i>=0) data.licenses[i] = l; }
  closeModal(); render(); toast('保存しました');
}
async function delLic(id){
  if(!confirm('この許可証を削除しますか？')) return;
  await q(sb.from('licenses').delete().eq('id', id));
  data.licenses = data.licenses.filter(x=>x.id!==id);
  closeModal(); render(); toast('削除しました');
}

/* 過去：退職した従業員。人事書類の保存義務があるため、削除せずにここで保持する。 */
function viewPastEmployees(){
  const list = scopeEmps(data.employees).filter(e=>e.status==='退職' && !isFamilyRec(e))
    .sort((a,b)=>(b.resignDate||'').localeCompare(a.resignDate||''));
  const tenure = e=>{
    if(!e.hireDate || !e.resignDate) return '—';
    const m = (new Date(e.resignDate) - new Date(e.hireDate)) / (1000*60*60*24*30.4375);
    if(m < 0) return '—';
    const y = Math.floor(m/12), mm = Math.round(m - y*12);
    return (y? y+'年':'') + (mm? mm+'か月' : (y? '':'1か月未満'));
  };
  return `
  <div class="panel">
    <h2>🗃 過去 <span class="en">退職した従業員（${list.length}名）</span></h2>
    <p class="muted" style="margin-bottom:10px">退職者のデータは削除せずにここに残しています（労働者名簿などは退職後5年の保存義務があります）。

        <td>${esc(e.empNo||'—')}</td>
        <td><b>${esc(e.nameKanji||e.nameRoma)}</b><br><span class="muted">${esc(e.nameKana||'')}</span></td>
        <td>${esc(e.nationality||'')}</td>
        <td>${esc(e.employmentType||'')}</td>
        <td class="small">${esc(e.affiliation||'—')}${e.workplace&&e.workplace!==e.affiliation?`<br><span class="muted">勤務：${esc(e.workplace)}</span>`:''}</td>
        <td>${esc(e.department||'')}</td>
        <td>${fmtDate(e.hireDate)}</td>
        <td>${e.resignDate? fmtDate(e.resignDate) : '<span class="badge b-yellow">未入力</span>'}</td>
        <td>${tenure(e)}</td>
      </tr>`).join('') || '<tr><td colspan="9" class="muted">退職した従業員はいません。</td></tr>'}
    </table></div>
  </div>`;
}

async function setDoc(empId, docId, field, val){
  const e = empById(empId); if(!e) return;
  if(!e.docs[docId]) e.docs[docId] = {status:'未依頼', date:'', note:''};
  const st = e.docs[docId];
  st[field]=val;
  if(field==='status' && (val==='受領'||val==='確認済') && !st.date) st.date = today();
  await q(sb.from('employee_docs').upsert({employee_id:empId, doc_id:docId, status:st.status, date:dOrNull(st.date), note:st.note||''}));
  render();
}

/* ---------------- evaluations（評価シート2026新版） ---------------- */
function evalKpiCalc(k){
  const t = parseFloat(k.target), f = parseFloat(k.final);
  const adj = (k.adjusted!==''&&k.adjusted!=null)? parseFloat(k.adjusted) : NaN;
  if(!t || isNaN(f)) return {rate:null, auto:null, score: isNaN(adj)? null : adj};
  const rate = f/t;
  const auto = rate>=1.2?5 : rate>=1?4 : rate>=0.8?3 : rate>=0.6?2 : 1;
  return {rate, auto, score: isNaN(adj)? auto : adj};
}
function evalCalc(v){
  const wts = EVAL_ROLES[v.role] || EVAL_ROLES['紹介営業'];
  let wsum=0, ssum=0;
  (v.kpis||[]).forEach(k=>{
    const w = parseFloat(k.weight); const c = evalKpiCalc(k);
    if(w && c.score!=null){ wsum+=w; ssum+=w*c.score; }
  });
  const aSub = wsum? Math.round(ssum/wsum*100)/100 : null;
  const avg = arr => { const xs=arr.map(x=>parseFloat(x.mgr)).filter(x=>!isNaN(x)); return xs.length? Math.round(xs.reduce((s,x)=>s+x,0)/xs.length*100)/100 : null; };
  const bSub = avg(v.comps||[]);
  const cSub = avg(v.atts||[]);
  let total=null, rank='', coef='', band='';
  if(aSub!=null && bSub!=null && cSub!=null){
    total = Math.round((aSub*wts.a/100 + bSub*wts.b/100 + cSub*wts.c/100)*100)/100;
    for(const r of RANK_TABLE){ if(total>=r[0]){ rank=r[1]; coef=r[2]; band=r[3]; break; } }
  }
  return {wts, aSub, bSub, cSub, total, rank, coef, band};
}

  if(wsum && wsum!==100 && !confirm(`KPIのウェイト合計が${wsum}%です（推奨100%）。このまま保存しますか？`)) return;
  const c = evalCalc(v);
  if((c.rank==='S'||c.rank==='D') && !v.sdReason.trim() && !confirm(`ランク${c.rank}には理由の記載が必須です。理由なしで保存しますか？`)) return;

  else{ const i = data.evaluations.findIndex(x=>x.id===v.id); if(i>=0) data.evaluations[i]=v; }
  toast('保存しました' + (c.rank? `（総合${c.total}・ランク${c.rank}）`:''));
  closeModal(); render();
}

/* ---------------- KPI ---------------- */
/* 達成率。「少ないほど良い」KPI（退職者数など）は 目標/実績 で計算するため、
   実績が目標を下回るほど100%を超える。 */
function kpiRate(k){
  const t = parseFloat(k.target);
  const a = (k.records||[]).reduce((s,r)=>s+(parseFloat(r.actual)||0),0);
  if(!t) return null;
  if(k.lowerBetter) return a<=0 ? 200 : Math.round(t/a*100);
  return Math.round(a/t*100);
}
function kpiActual(k){ return (k.records||[]).reduce((s,r)=>s+(parseFloat(r.actual)||0),0); }

  if(kpiPeriodFilter) list = list.filter(k=>k.period===kpiPeriodFilter);
  return `

      const rows = list.filter(k=>k.scope===sc);
      if(!rows.length) return '';
      /* 担当（部署・チーム・個人）ごとにまとめて見せる */
      const groups = [...new Set(rows.map(k=> sc==='個人'? empName(k.empId) : (k.dept||'—')))];
      return `<div class="section-title">${sc==='全社'?'🏢 全体目標':sc==='部署'?'🏬 部署目標':sc==='チーム'?'🌏 国籍チーム目標':'👤 個人目標'}
        <span class="en">${rows.length}件</span></div>
      <div class="tablewrap"><table>
        <tr><th>${sc==='全社'?'期間':'担当'}</th><th>KPI名</th><th>目標</th><th>実績累計</th><th>達成率</th></tr>
        ${groups.map(g=>{
          const gr = rows.filter(k=> (sc==='個人'? empName(k.empId) : (k.dept||'—')) === g);
          return gr.map((k,i)=>{
            const rate = kpiRate(k);
            const good = rate!==null && rate>=100, warn = rate!==null && rate>=70;
            return `<tr class="clickable" onclick="openKpiForm('${k.id}')">
              <td>${i===0? (sc==='全社'? esc(k.period) : `<b>${esc(g)}</b>`) : ''}</td>
              <td>${esc(k.name)}${k.lowerBetter?' <span class="badge b-gray" title="少ないほど良いKPI">↓良</span>':''}
                ${k.notes?`<br><span class="muted">${esc(k.notes)}</span>`:''}</td>
              <td>${k.lowerBetter?'≤ ':''}${esc(k.target)} ${esc(k.unit)}</td>
              <td>${kpiActual(k)} ${esc(k.unit)}</td>
              <td>${rate===null?'—':`<div style="display:flex;align-items:center;gap:8px">
                <div class="progress" style="flex:1;min-width:60px"><div style="width:${Math.min(rate,100)}%;background:${good?'var(--ok)':warn?'var(--accent)':'var(--warn)'}"></div></div>
                <b style="color:${good?'var(--ok)':warn?'var(--text)':'var(--danger)'}">${rate}%</b></div>`}</td>
            </tr>`;
          }).join('');
        }).join('')}
      </table></div>`;
    }).join('') || '<div class="muted">KPIが登録されていません。例：特定技能 支援対象者数、紹介成約数、面談実施数、定期報告提出率…</div>'}
  </div>`;
}

async function saveKpi(isNew){
  const k = window._kpiDraft;
  k.period = document.getElementById('kp_period').value.trim();
  k.scope = document.getElementById('kp_scope').value;
  k.empId = k.scope==='個人'? document.getElementById('kp_emp').value : '';
  k.dept = (k.scope==='部署'||k.scope==='チーム')? document.getElementById('kp_dept').value : '';
  k.name = document.getElementById('kp_name').value.trim();
  k.target = document.getElementById('kp_target').value;
  k.unit = document.getElementById('kp_unit').value.trim();
  k.lowerBetter = document.getElementById('kp_lower').value === '1';
  k.notes = document.getElementById('kp_notes').value;
  if(!k.name){ alert('KPI名を入力してください'); return; }
  await q(sb.from('kpis').upsert(kpiToDb(k)));
  if(isNew) data.kpis.push(k);
  else{ const i = data.kpis.findIndex(x=>x.id===k.id); if(i>=0) data.kpis[i]=k; }
  toast('保存しました');
  closeModal(); render();
}
async function deleteKpi(id){
  if(!confirm('このKPIを削除しますか？')) return;
  await q(sb.from('kpis').delete().eq('id', id));
  data.kpis = data.kpis.filter(k=>k.id!==id);
  toast('削除しました');
  closeModal(); render();
}

async function saveAsset(id, isNew){
  const g = i=>document.getElementById(i).value;
  let a = isNew? {id} : data.assets.find(x=>x.id===id);
  Object.assign(a,{
    assetNo:g('as_no').trim(), category:g('as_cat'), name:g('as_name').trim(), serial:g('as_serial').trim(),
    purchaseDate:g('as_pdate'), price:g('as_price'), status:g('as_status'),
    assignedTo:g('as_emp'), lendDate:g('as_lend'), returnDate:g('as_return'), notes:g('as_notes')
  });
  if(a.assignedTo && a.status==='在庫') a.status='貸与中';
  if(!a.assignedTo && a.status==='貸与中') a.status='在庫';
  if(!a.name){ alert('名称を入力してください'); return; }
  await q(sb.from('assets').upsert(assetToDb(a)));
  if(isNew) data.assets.push(a);
  toast('保存しました');
  closeModal(); render();

}

async function setUserMhStaff(em, on){
  if(!canAdmin()){ toast(denyMsg(), true); render(); return; }
  await q(sb.from('allowed_users').update({mh_staff:!!on}).eq('email', em));
  const u = data.allowedUsers.find(x=>x.email===em);
  if(u) u.mhStaff = !!on;
  render(); toast(em + (on? ' をメンタル担当にしました' : ' のメンタル担当を外しました'));
}
async function addUser(){
  const em = document.getElementById('nu_email').value.trim().toLowerCase();
  const name = document.getElementById('nu_name').value.trim();
  const role = document.getElementById('nu_role').value;
  if(!em || !em.includes('@')){ alert('メールアドレスを入力してください'); return; }
  if(data.allowedUsers.some(u=>u.email.toLowerCase()===em)){ alert('既に登録されています'); return; }
  if(!ROLES.includes(role)){ alert('権限レベルが不正です'); return; }
  await q(sb.from('allowed_users').insert({email:em, display_name:name, role:role}));
  data.allowedUsers.push({email:em, name:name, role:role, addedAt:today()});
  render(); toast('追加しました');
}
async function setUserRole(em, role){
  if(!ROLES.includes(role)) return;
  if(em.toLowerCase()===myEmail()){ alert('自分自身の権限は変更できません'); render(); return; }
  await q(sb.from('allowed_users').update({role:role}).eq('email', em));
  const u = data.allowedUsers.find(x=>x.email===em);
  if(u) u.role = role;
  render(); toast(em+' を「'+role+'」に変更しました');
}
async function removeUser(em){
  if(em.toLowerCase()===myEmail()){ alert('自分自身は削除できません'); return; }
  if(!confirm(em+' のアクセス権を削除しますか？\n（ログインできなくなります）')) return;
  await q(sb.from('allowed_users').delete().eq('email', em));
  data.allowedUsers = data.allowedUsers.filter(x=>x.email!==em);
  render(); toast('削除しました');
}

async function addDept(){
  const v = document.getElementById('newDept').value.trim();
  if(!v) return;
  if(data.departments.includes(v)){ alert('既に存在します'); return; }
  await q(sb.from('departments').insert({name:v, sort_order:data.departments.length+1}));
  data.departments.push(v);
  render();
}
async function removeDept(name){
  await q(sb.from('departments').delete().eq('name', name));
  data.departments = data.departments.filter(d=>d!==name);
  render();
}
async function addTpl(){
  const name = document.getElementById('tpl_name').value.trim();
  if(!name){ alert('書類名を入力してください'); return; }
  const t = {id:'u'+uid().slice(0,8), stage:document.getElementById('tpl_stage').value, name,
    tags:[document.getElementById('tpl_tag').value], note:document.getElementById('tpl_note').value.trim(),
    sort_order: Math.max(0,...data.docTemplates.map(x=>x.sort_order||0))+1};
  await q(sb.from('doc_templates').insert(t));
  data.docTemplates.push(t);
  render();
}
async function removeTpl(id){
  if(!confirm('この書類をマスタから削除しますか？（各従業員の記録は残ります）')) return;
  await q(sb.from('doc_templates').delete().eq('id', id));
  data.docTemplates = data.docTemplates.filter(t=>t.id!==id);
  render();
}
async function resetTpl(){
  if(!confirm('書類マスタを初期状態（既定のテンプレート）に戻しますか？追加した書類は消えます。')) return;
  await q(sb.from('doc_templates').delete().neq('id',''));

async function wipeAll(){

function download(filename, content, mime){
  const blob = new Blob([content], {type:mime||'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}

async function importJson(){
  if(!canAdmin()){ toast('取込（全置換）は「全体管理」権限のみ実行できます', true); return; }
  const f = document.getElementById('importFile').files[0];
  if(!f){ alert('JSONファイルを選択してください'); return; }
  const text = await f.text();
  let d;
  try{ d = JSON.parse(text); }catch(e){ alert('JSONの解析に失敗しました：'+e.message); return; }
  if(!d.employees || !Array.isArray(d.employees)){ alert('形式が違います（employeesがありません）'); return; }
  if(!confirm(`従業員${d.employees.length}名のデータを取り込みます。現在のSupabase上のデータは全て置き換えられます。よろしいですか？`)) return;
  if(!confirm('最終確認：現在のデータのバックアップは保存済みですか？実行します。')) return;
  toast('取込中…');
  try{
    // wipe
    await q(sb.from('assets').delete().neq('id','00000000-0000-0000-0000-000000000000'));
    await q(sb.from('kpis').delete().neq('id','00000000-0000-0000-0000-000000000000'));
    await q(sb.from('evaluations').delete().neq('id','00000000-0000-0000-0000-000000000000'));
    await q(sb.from('employees').delete().neq('id','00000000-0000-0000-0000-000000000000'));
    await q(sb.from('doc_templates').delete().neq('id',''));
    await q(sb.from('departments').delete().neq('name',''));
    // remap old (non-uuid) ids to uuids
    const isUuid = s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s||'');
    const idMap = {};
    const mapId = old=>{ if(isUuid(old)) return old; if(!idMap[old]) idMap[old]=uid(); return idMap[old]; };
    // departments
    const deps = (d.departments||[]).map((name,i)=>({name, sort_order:i+1}));
    if(deps.length) await q(sb.from('departments').insert(deps));
    // doc templates
    const tpls = (d.docTemplates||DEFAULT_DOC_TEMPLATES).map((t,i)=>({id:t.id, stage:t.stage, name:t.name, tags:t.tags, note:t.note||'', sort_order:t.sort_order!=null?t.sort_order:i+1}));
    if(tpls.length) await q(sb.from('doc_templates').insert(tpls));
    // employees
    const emps = d.employees.map(e=>{ const ne = Object.assign({}, e, {id:mapId(e.id)}); return ne; });
    if(emps.length) await q(sb.from('employees').insert(emps.map(empToDb)));
    // employee docs
    const docRows = [];
    emps.forEach(e=>{
      Object.entries(e.docs||{}).forEach(([docId, st])=>{
        docRows.push({employee_id:e.id, doc_id:docId, status:st.status||'未依頼', date:dOrNull(st.date), note:st.note||''});
      });
    });
    if(docRows.length) await q(sb.from('employee_docs').insert(docRows));
    // evaluations
    const evals = (d.evaluations||[]).map(v=>Object.assign({}, v, {id:mapId(v.id), empId:mapId(v.empId)}));
    if(evals.length) await q(sb.from('evaluations').insert(evals.map(evalToDb)));
    // kpis
    const kpis = (d.kpis||[]).map(k=>Object.assign({}, k, {id:mapId(k.id), empId:k.empId?mapId(k.empId):''}));
    if(kpis.length) await q(sb.from('kpis').insert(kpis.map(kpiToDb)));
    // assets
    const assets = (d.assets||[]).map(a=>Object.assign({}, a, {id:mapId(a.id), assignedTo:a.assignedTo?mapId(a.assignedTo):''}));
    if(assets.length) await q(sb.from('assets').insert(assets.map(assetToDb)));
    // skills（v3以降のバックアップのみ。無ければ既定テンプレートを維持）
    if(Array.isArray(d.skillDefs) && d.skillDefs.length){
      await q(sb.from('skill_defs').delete().neq('id',''));
      await q(sb.from('skill_defs').insert(d.skillDefs));
      const skRows = [];
      Object.entries(d.empSkills||{}).forEach(([empId, m])=>{
        Object.entries(m).forEach(([skillId, v])=>{
          const tl = v.taskLevels||{};
          if(v.level>0 || Object.keys(tl).length)
            skRows.push({employee_id:mapId(empId), skill_id:skillId, level:v.level||0, note:v.note||'', task_levels:tl});
        });
      });
      if(skRows.length) await q(sb.from('employee_skills').insert(skRows));
    }
    await loadAll(); render(); toast('取込が完了しました');
  }catch(e){
    toast('取込エラー：'+e.message, true);
  }
}

function printDoc(empId, key){
  const e = empById(empId); if(!e) return;
  const t = PRINT_DOCS[key]; if(!t) return;
  const w = window.open('', '_blank');
  if(!w){ alert('ポップアップがブロックされました。ブラウザの設定でこのサイトのポップアップを許可してください。'); return; }
  w.document.write(docShell(t.title, t.build(e)));
  w.document.close();
}

/* ---------------- modal ---------------- */
function modal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

sb.auth.onAuthStateChange((event, s)=>{
  if(event==='SIGNED_OUT'){ session=null; showLogin(); return; }
  // トークン自動更新後も session を最新に保つ（古いトークンを持ち続けないため）
  if(s) session = s;
  // 再設定リンクの処理が boot() より遅れて終わった場合の保険
  if(event==='PASSWORD_RECOVERY'){ showNewPassword(); }
});
